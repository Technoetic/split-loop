<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="app-build" content="__BUILD_ID__">
  <title>LOOP / SPLIT — 한 루프, 두 가지 임무</title>

  <link rel="stylesheet" href="__STYLE_URL__">

<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="#/" data-route="/"><img src="__ICON_URL__" alt="" width="29" height="29"><span>LOOP <span class="brand-slash">/</span> SPLIT</span></a>
    <nav class="nav-links" aria-label="주 메뉴"><a href="#/guide" data-route="/guide">플레이 가이드</a><a href="#/records" data-route="/records">내 기록</a></nav>

  </div>
</dialog>
